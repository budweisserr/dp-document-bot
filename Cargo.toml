[package]
name = "dpq"
version = "0.1.0"
edition = "2021"
description = "Fast, polite e-queue monitor for DP Document passport centres (pasport.org.ua)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
wreq = { version = "0.16", features = ["form", "json", "cookies", "gzip", "brotli", "deflate", "zstd", "socks"] }
wreq-util = { version = "0.2", features = ["emulation-compression"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
fastrand = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
